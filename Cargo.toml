[package]
name = "hell_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
# tokio: 비동기 런타임 (멀티스레드, 네트워크, 타이머 등 전체 기능 포함)
tokio = { version = "1", features = ["full"] }
slint = "1.5"

# serde: 메시지 데이터를 JSON 등으로 변환할 때 사용 (성능 검증용)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
